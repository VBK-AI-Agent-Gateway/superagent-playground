<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林小舟 · 个人作品集（三页静态站点）</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
           max-width: 640px; margin: 48px auto; padding: 0 20px; line-height: 1.8; color: #1f2430; }
    code { background: #f0f2f8; padding: 1px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>林小舟 · 个人作品集</h1>
  <p>三页面纯静态站点（HTML + 手写 CSS + 少量原生 JS）：零依赖、零构建、无外部 CDN。</p>
  <h2>页面入口</h2>
  <ul>
    <li><a href="index.html">index.html</a> —— 首页：个人简介、头像主视觉、技能/服务、作品与联系入口</li>
    <li><a href="works.html">works.html</a> —— 作品列表：四个作品卡片网格</li>
    <li><a href="contact.html">contact.html</a> —— 联系表单：姓名、邮箱、留言 + 前端校验</li>
  </ul>
  <h2>本地运行</h2>
  <p>直接双击 <code>index.html</code> 即可；或在本目录执行 <code>python3 -m http.server 8000</code> 后访问
     <code>http://localhost:8000/</code>。</p>
</body>
</html>
