<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070d14">
  <meta name="description" content="荣威 RX5 网页版车机系统 · 10.4 英寸竖屏座舱演示（模拟数据）">
  <title>荣威 RX5 · 智能座舱</title>

  <!-- 本地依赖：零构建、可离线双击运行 -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/tailwindcss.js"></script>

  <!-- 运行时配置（高德 Key、车辆信息、默认值、模拟器初值） -->
  <script src="config.js"></script>

  <script>
    if (window.tailwind) {
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cockpit: {
                bg: 'var(--c-bg)',
                panel: 'var(--c-panel)',
                panel2: 'var(--c-panel-2)',
                line: 'var(--c-line)',
                text: 'var(--c-text)',
                sub: 'var(--c-text-sub)',
                muted: 'var(--c-text-muted)'
              },
              rowe: { 400: '#3f8cff', 500: '#1e6fff', 600: '#0d55d6', glow: '#5fb0ff' },
              signal: { ok: '#2ee6a8', warn: '#ffb020', bad: '#ff5f56' }
            },
            fontFamily: { cockpit: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'] }
          }
        }
      };
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>
  <div id="app" v-cloak>
    <div class="boot-splash">
      <div class="boot-logo">RX5</div>
      <p class="boot-text">正在启动智能座舱…</p>
    </div>
  </div>

  <!-- ============ 数据层 ============ -->
  <script src="js/data/mock.js"></script>

  <!-- ============ 状态与安全规则 ============ -->
  <script src="js/store/state.js"></script>
  <script src="js/store/safety.js"></script>

  <!-- ============ 核心能力 ============ -->
  <script src="js/core/voice-registry.js"></script>
  <script src="js/core/voice.js"></script>
  <script src="js/core/map-loader.js"></script>
  <script src="js/core/simulator.js"></script>

  <!-- ============ 通用组件 ============ -->
  <script src="js/components/icon.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/statusbar.js"></script>
  <script src="js/components/dock.js"></script>
  <script src="js/components/car-model.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/gear-guard.js"></script>
  <script src="js/components/voice-orb.js"></script>
  <script src="js/components/light-panel.js"></script>
  <script src="js/components/simulator-panel.js"></script>

  <!-- ============ 页面模块（8 个） ============ -->
  <script src="js/views/home.js"></script>
  <script src="js/views/nav.js"></script>
  <script src="js/views/climate.js"></script>
  <script src="js/views/media.js"></script>
  <script src="js/views/vehicle.js"></script>
  <script src="js/views/voice-panel.js"></script>
  <script src="js/views/surround.js"></script>
  <script src="js/views/parking.js"></script>
  <script src="js/views/settings.js"></script>

  <!-- ============ 应用装配 ============ -->
  <script src="js/app.js"></script>
</body>
</html>
