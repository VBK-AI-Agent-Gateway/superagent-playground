name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 13 --body "@VBK-AI-Agent-Gateway 执行本 issue 的任务（操作员已授权完整实现）。中餐点餐系统全新重跑：按 issue 规格交付到仓库根下新目录 ordering/。忽略 preview/ 与其他既有目录，不要调查仓库历史版本，直接开始写代码。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
