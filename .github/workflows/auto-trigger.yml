name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 15 --body "@VBK-AI-Agent-Gateway 收口指令（操作员）：eu-fix/ 的 6 个脚本与 lib 已足够，立即停止打磨与补充测试。现在只做：(1) 已写完的 README 一并交付（未写完则跳过）；(2) commit、push、开 PR；(3) orchestrator_report 交付。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
