name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 22 --body "@VBK-AI-Agent-Gateway 执行：（操作员说明）dsh 于 17:56 UTC 例行维护重启，你的 worker 会话被中断（中断时你在阅读阶段，第一个文件 patch-scope.sh 刚落盘）。请从现有进度继续执行原任务：按 issue #22 正文完整规格实施 fast-route/ 交付包，逐段落盘小步 commit。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
