name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 17 --body "@VBK-AI-Agent-Gateway 执行本 issue 的任务（操作员已授权完整实现）。交付物为 eu-fix/07-shield-bypass.sh 单文件自包含脚本（dry-run 默认、--apply 生效），按 issue 现场信息精确编写。忽略其他目录，直接开始写。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
