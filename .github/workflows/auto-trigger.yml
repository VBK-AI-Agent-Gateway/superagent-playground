name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 17 --body "@VBK-AI-Agent-Gateway 缺陷修复（操作员实测反馈，指向你的 eu-fix/07-shield-bypass.sh）：执行时第 3 步 mask 被 systemd 拒绝——unit 文件真实存在于 /etc/systemd/system/ 时 systemctl mask 拒绝创建 /dev/null 链接（File already exists），且脚本 set -eu 在此中止导致后续步骤未执行（操作员已手工接管完成，服务器侧无需再动）。请修正仓库分支上 eu-fix/07-shield-bypass.sh 的 mask 步骤：先 mkdir -p 存档目录并 mv 两个 unit 文件过去 + systemctl daemon-reload，然后再 systemctl mask；mask 后校验 ls -l /etc/systemd/system/asg-bypass-collect.* 指向 /dev/null。修完 commit+push 同分支并在本 issue 回复修正摘要，不必重开 PR。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
