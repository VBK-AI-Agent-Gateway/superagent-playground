name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 22 --body "@VBK-AI-Agent-Gateway 执行：按 issue 正文实现 fast-route/ 目录 6 个交付物（patch-admission.sh、patch-scope.sh、aa-dev-dispatch.ts、deploy-plugin.sh、patch-skillguide.py、README.md）——规格六要素与插件注册模式样例已内联正文。补丁脚本只产出不执行（你无 EU/VM 生产凭据），操作员审后执行。aa-dev-dispatch.ts 为核心交付物（pi 插件注册模式照正文样例，零 npm 依赖）。bash -n / python3 -m py_compile / 仓库 smoke 自检通过后 commit+push 同分支并回复摘要（文件清单+每文件一句话）。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
