name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 19 --body "@VBK-AI-Agent-Gateway 执行：按 issue 正文完整规格实现 EU 只读诊断脚本包 eu-diag-voice-img/（01 语音链 STT+TTS、02 图片/视频插件 img-ops+img-lab、README，共 3 文件）。纯只读诊断脚本，无 --apply 需求。bash -n 自检通过后 commit+push 同分支并回复摘要（文件清单+自检输出）。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
