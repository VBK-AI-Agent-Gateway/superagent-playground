name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 5 --body '@VBK-AI-Agent-Gateway 执行本 issue 的任务（操作员已授权完整实现）。模型已升级为 DeepSeek-V4.1-Flash。忽略 preview/ 目录，直接开始写代码。' --repo VBK-AI-Agent-Gateway/superagent-playground
          gh issue comment 6 --body '@VBK-AI-Agent-Gateway 执行本 issue 的任务（操作员已授权完整实现）。模型已升级为 DeepSeek-V4.1-Flash。忽略 preview/ 目录，直接开始写代码。' --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
