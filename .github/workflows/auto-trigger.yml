name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 13 --body "@VBK-AI-Agent-Gateway 收口指令（操作员）：立即停止一切探索与分析。你的 ordering/ 已有足够代码（2291 行）。现在只做三件事：(1) 运行 scripts/smoke.sh ordering；(2) 修复其报告的全部 FAIL 项（若有）；(3) 达到 SMOKE PASS 后立即 commit、push、开 PR 并 orchestrator_report 交付。不要再扩展新功能，不要再读取任何文件除非 smoke 报错指向它。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
