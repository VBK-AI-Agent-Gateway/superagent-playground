name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention
        run: |
          gh issue comment 17 --body "@VBK-AI-Agent-Gateway 追加需求（操作员明确指令）：脚本 --apply 的第 5 步（bin 隔离）之后追加第 6 步【历史数据清除】：rm -rf /opt/asg-harness2-bypass/out /opt/asg-harness2-bypass/harness2-ext /opt/asg-harness2-bypass/state /opt/asg-harness2-bypass/logs /opt/asg-harness2-bypass/library /opt/asg-harness2-bypass/proposals（删除前先 du -sh 打印各目录大小计入日志；README.md 与 CONCLUSION*.md 保留存档；bin.disabled 保持隔离态）。dry-run 时列出将删除的目录与大小。第 7 步验证不变（零新写入+主系统健康前后一致）。回退说明改为：数据不可恢复（操作员知情），unit unmask+enable 可恢复功能。" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
