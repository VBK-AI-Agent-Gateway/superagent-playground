name: auto-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: mention agent
        run: gh issue comment 4 --body "@VBK-AI-Agent-Gateway 执行本 issue 的任务（操作员已授权完整实现）" --repo VBK-AI-Agent-Gateway/superagent-playground
        env:
          GH_TOKEN: ${{ github.token }}
